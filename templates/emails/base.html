<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ business.name }}</title>
</head>
{# Email clients ignore <style> blocks and CSS variables, so the design tokens are inlined as hex. #}
<body style="margin:0;padding:0;background:#f7f8fa;font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fa;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;">
          <tr>
            <td style="padding:24px 24px 0;font-size:14px;font-weight:600;color:#2563eb;">{{ business.name }}</td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="max-width:560px;margin:16px auto 0;font-size:12px;line-height:1.5;color:#94a3b8;">
          Bu xat {{ business.name }} bron tizimidan avtomatik yuborildi. Vaqtlar {{ when.tz }} zonasida.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
