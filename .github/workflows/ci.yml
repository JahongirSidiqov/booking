name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Committed CSS matches the templates
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss -i static/src/app.css -o /tmp/app.css --minify
          diff -q static/css/app.css /tmp/app.css || {
            echo "static/css/app.css is stale: run scripts/build-css.ps1 and commit it"; exit 1; }

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: navbat
          POSTGRES_USER: navbat
          POSTGRES_PASSWORD: navbat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navbat -d navbat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://navbat:navbat@localhost:5432/navbat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t navbat:ci .
