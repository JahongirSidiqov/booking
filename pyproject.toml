[project]
name = "navbat"
version = "0.1.0"
description = "Navbat — appointment booking system for small service businesses"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles", "**/migrations/*.py", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "RUF"]
# RUF001-003: Uzbek text uses the letters ʻ (U+02BB) and ʼ (U+02BC) on purpose.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["e2e: real-browser tests (Playwright); skipped when Playwright is not installed"]
testpaths = ["tests"]
filterwarnings = [
    # WhiteNoise warns when collectstatic has not run; tests never serve static files.
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/apps.py"]
