name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Committed CSS matches the templates
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss -i assets/css/app.css -o /tmp/app.css --minify
          diff -q static/css/app.css /tmp/app.css || {
            echo "static/css/app.css is stale: run scripts/build-css.ps1 and commit it"; exit 1; }

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: navbat
          POSTGRES_USER: navbat
          POSTGRES_PASSWORD: navbat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navbat -d navbat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://navbat:navbat@localhost:5432/navbat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --cov --cov-report=term-missing
      - name: Production settings pass Django's deployment checklist
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-deploy-check-key-that-is-long-enough-and-random-looking-9f8e7d6c5b4a
          ALLOWED_HOSTS: navbat.example.uz
      - name: Demo seed runs on a clean database
        run: python manage.py migrate --noinput && python manage.py seed_demo
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t navbat:ci .

  compose-smoke:
    # The production stack exactly as a VPS would run it: build, migrate, serve, schedule.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Production env for the smoke test
        run: |
          cp .env.prod.example .env.prod
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env.prod
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env.prod
          sed -i "s|^EMAIL_BACKEND=.*|EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend|" .env.prod
      - name: Start db + web + scheduler
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait --wait-timeout 180
      - name: Health, HTTPS redirect, static files, seed, scheduler
        run: |
          curl -fsS http://localhost:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = "301"
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T web python manage.py seed_demo
          curl -fsS -H "X-Forwarded-Proto: https" http://localhost:8000/ | grep -q "Navbat Barbershop"
          # WhiteNoise serves hashed names in production: read the real URL from the page.
          css=$(curl -fsS -H "X-Forwarded-Proto: https" http://localhost:8000/ | grep -o '/static/css/app\.[0-9a-f]*\.css' | head -1)
          test -n "$css"
          curl -fsS -o /dev/null -H "X-Forwarded-Proto: https" "http://localhost:8000$css"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs scheduler | grep -q "expired:"
      - if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs
