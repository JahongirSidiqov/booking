<div class="field">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    <p class="field-error" id="{{ field.auto_id }}-error" role="alert">{{ field.errors|first }}</p>
  {% elif field.help_text %}
    <p class="helper" id="{{ field.auto_id }}-help">{{ field.help_text }}</p>
  {% endif %}
</div>
